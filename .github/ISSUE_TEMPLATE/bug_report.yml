name: Bug report
description: Something Vascula does differently from what the documentation says.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Vascula version
      placeholder: v1.0.1
    validations:
      required: true
  - type: textarea
    id: template
    attributes:
      label: Template
      description: The smallest template that shows the problem.
      render: text
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Data and options
      description: The data, settings and any compile or render options involved. Use fictional values.
      render: json
  - type: textarea
    id: expected
    attributes:
      label: Expected output
      render: text
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual output or error
      render: text
    validations:
      required: true
