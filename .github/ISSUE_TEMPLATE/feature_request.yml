name: Feature request
description: A change to the language or the Go API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The template or program you want to write, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: A template and the output you expect from it, if you have one in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
